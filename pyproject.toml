[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocalis"
version = "0.1.0"
description = "Offline voice AI workstation: dictation, quick reader, document reader, OCR reader"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.6,<3",
    "tomli-w>=1.0,<2",
    "numpy>=1.26,<3",
    "onnx-asr[gpu]>=0.12,<1",
    "nvidia-cudnn-cu12>=9.0,<10",
    "sounddevice>=0.4.6,<1",
    "evdev>=1.7,<2",
    "pypdf>=5,<6",
    "python-docx>=1.1,<2",
    "PySide6>=6.7,<7",
    "qwen-tts==0.1.1",
    "transformers==4.57.3",
    "accelerate==1.12.0",
    "torchaudio>=2.0,<3",
    "soundfile>=0.12,<1",
    "einops>=0.7,<1",
    "librosa>=0.10,<1",
    "huggingface-hub>=0.20,<1",
    "colorlog>=6.9,<7",
    "espeakng-loader>=0.2.4,<1",
    "phonemizer-fork==3.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "mypy>=1.10,<2",
    "pytest-qt>=4.4,<5",
    "reportlab>=4,<5",
]

[project.scripts]
vocalis = "vocalis.entry:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/vocalis"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src/vocalis", "tests", "packaging/installer/lib/fetch_models.py"]

[[tool.mypy.overrides]]
module = "sounddevice"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qwen_tts"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docx"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docx.opc.exceptions"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=vocalis --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/vocalis"]
branch = true
